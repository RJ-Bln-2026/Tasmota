name: Tasmota32 Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install PlatformIO
        run: pip install platformio

      - name: Run Tasmota32 build
        run: pio run -e tasmota32

      # -----------------------------------------------------
      # Artefakt-Ordner erstellen
      # -----------------------------------------------------
      - name: Create artifact folder
        run: mkdir -p artifacts/full_build

      # -----------------------------------------------------
      # ALLE Dateien aus dem Build kopieren
      # -----------------------------------------------------

      # 1. Alles aus .pio/build/tasmota32/
      - name: Copy full build output
        run: cp -r .pio/build/tasmota32/* artifacts/full_build/

      # 2. Safeboot aus variants
      - name: Copy safeboot.bin
        run: cp variants/tasmota/tasmota32-safeboot.bin artifacts/full_build/

      # 3. Boot_app0 aus Framework
      - name: Copy boot_app0.bin
        run: cp /home/runner/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin artifacts/full_build/

      # -----------------------------------------------------
      # Artefakt hochladen (alles drin)
      # -----------------------------------------------------
      - name: Upload ALL build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: tasmota32-complete-build
          path: artifacts/
