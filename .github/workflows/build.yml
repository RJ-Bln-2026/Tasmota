name: Tasmota32 Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # -----------------------------------------------------
      # 1. Repository auschecken
      # -----------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v3

      # -----------------------------------------------------
      # 2. PlatformIO installieren
      # -----------------------------------------------------
      - name: Install PlatformIO
        run: pip install platformio

      # -----------------------------------------------------
      # 3. Tasmota32 Build starten
      # -----------------------------------------------------
      - name: Run Tasmota32 build
        run: pio run -e tasmota32

      # -----------------------------------------------------
      # 4. Artefakt-Ordner erstellen (ohne .pio)
      # -----------------------------------------------------
      - name: Create artifact folder
        run: mkdir -p artifacts

      # -----------------------------------------------------
      # 5. ALLE relevanten Dateien in den Artefakt-Ordner kopieren
      # -----------------------------------------------------

      # Firmware
      - name: Copy firmware.bin
        run: cp .pio/build/tasmota32/firmware.bin artifacts/

      # Bootloader
      - name: Copy bootloader.bin
        run: cp .pio/build/tasmota32/bootloader.bin artifacts/

      # Partitions
      - name: Copy partitions.bin
        run: cp .pio/build/tasmota32/partitions.bin artifacts/

      # Safeboot aus variants
      - name: Copy safeboot.bin
        run: cp variants/tasmota/tasmota32-safeboot.bin artifacts/

      # ELF (Debug)
      - name: Copy firmware.elf
        run: cp .pio/build/tasmota32/firmware.elf artifacts/

      # Boot_app0
      - name: Copy boot_app0.bin
        run: cp /home/runner/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin artifacts/

      # Full build folder (optional, aber ALLES drin)
      - name: Copy full build folder
        run: cp -r .pio/build/tasmota32 artifacts/full_build

      # -----------------------------------------------------
      # 6. Artefakt hochladen (alles drin)
      # -----------------------------------------------------
      - name: Upload all artifacts
        uses: actions/upload-artifact@v3
        with:
          name: tasmota32-complete-build
          path: artifacts/
