name: Build Tasmota32 Nous A8T

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Tasmota Source
        run: |
          wget https://github.com
          tar -xzf v15.5.0.0.tar.gz --strip-components=1
          rm v15.5.0.0.tar.gz

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Run PlatformIO Build for ESP32
        run: |
          pio run -e tasmota32-DE

      - name: Upload Firmware Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tasmota32-NousA8T-DE
          path: .pio/build/tasmota32-DE/firmware.bin
