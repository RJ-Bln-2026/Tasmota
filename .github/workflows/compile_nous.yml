name: Build Tasmota32 Nous A8T

on:
  workflow_dispatch: # Manueller Start per Klick

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Run PlatformIO Build for ESP32
        run: |
          # Baut dein deutsches Tasmota32 direkt mit deiner gecheckten Konfiguration
          pio run -e tasmota32-DE

      - name: Upload Firmware Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tasmota32-NousA8T-DE
          path: .pio/build/tasmota32-DE/firmware.bin
