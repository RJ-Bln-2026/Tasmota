name: Build Tasmota32 Nous A8T

on:
  workflow_dispatch: # Ermöglicht den manuellen Start per Klick

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: v15.5.0.0 # Erzwingt die korrekte Tasmota-Version

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-node-version: '3.10'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install pioasm platformio

      - name: Run PlatformIO Build
        run: |
          # Baut gezielt die deutsche ESP32 Standardvariante
          pio run -e tasmota32-DE

      - name: Upload Firmware Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tasmota32-NousA8T-DE
          path: .pio/build/tasmota32-DE/firmware.bin
