name: Tasmota-Nous-A8T-Build
on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup-Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Build-Firmware
        run: |
          pip install platformio
          cp ./platformio_override_sample.ini ./platformio_override.ini
          sed -i 's/; default_envs = tasmota32c3/default_envs = tasmota32c3/g' ./platformio_override.ini
          platformio run -e tasmota32c3

      - uses: actions/upload-artifact@v7
        with:
          name: Tasmota-Nous-A8T
          path: ./.pio/build/tasmota32c3/firmware.bin
