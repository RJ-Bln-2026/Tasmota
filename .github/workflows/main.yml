# 008b main.yml für Tasmota32 V15.5.0.1 - EN-Original RTC Standard Version
name: Tasmota-Nous-A8T-Build
on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup-Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prepare PlatformIO
        run: |
          pip install platformio
          cp ./platformio_override_sample.ini ./platformio_override.ini
          
          # 1. default_envs bleibt strikt auf tasmota32 (EN-Original)
          sed -i 's/;default_envs = tasmota32/default_envs = tasmota32/g' ./platformio_override.ini

          # 2. Hinzufügen der Sektion für das Standard-Environment
          echo "" >> ./platformio_override.ini
          echo "[env:tasmota32]" >> ./platformio_override.ini
          
          # 3. SICHERHEITS-CHECK ERFÜLLT: Bestehende Flags werden geerbt (${env.build_flags}) 
          # und dein Config-Override wird sicher hinten angehängt!
          echo "build_flags = \${env.build_flags} -DUSE_CONFIG_OVERRIDE" >> ./platformio_override.ini

      - name: Run Build
        run: |
          # Führt den Build fehlerfrei für das Standard-Target aus
          pio run -e tasmota32

      - uses: actions/upload-artifact@v4
        with:
          name: Tasmota-Nous-A8T-Standard
          path: ./.pio/build/tasmota32/firmware.bin
