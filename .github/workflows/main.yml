# 008b main.yml für Tasmota32 V15.5.0.1 - EN-Original RTC Standard Version
name: Tasmota-Nous-A8T-Build
on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup-Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prepare PlatformIO
        run: |
          pip install platformio
          cp ./platformio_override_sample.ini ./platformio_override.ini
          
          # default_envs bleibt strikt auf tasmota32 (EN-Original)
          sed -i 's/;default_envs = tasmota32/default_envs = tasmota32/g' ./platformio_override.ini

      - name: Run Build
        # Das Flag wird hier als globale Variable übergeben - absolut fehlerfrei!
        env:
          PLATFORMIO_BUILD_FLAGS: -DUSE_CONFIG_OVERRIDE
        run: |
          pio run -e tasmota32

      - uses: actions/upload-artifact@v4
        with:
          name: Tasmota-Nous-A8T-Standard
          path: ./.pio/build/tasmota32/firmware.bin
