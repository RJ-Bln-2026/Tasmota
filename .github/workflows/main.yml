name: Tasmota-Nous-A8T-Build
on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup-Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Build-Firmware
        run: |
          pip install platformio
          # Kopiert das Sample, falls keine override existiert
          cp ./platformio_override_sample.ini ./platformio_override.ini
          # Aktiviert die Zeile für die deutsche Umgebung (tasmota32-DE)
          sed -i 's/;default_envs = tasmota32/default_envs = tasmota32-DE/g' ./platformio_override.ini
          # Startet das Build
          pio run -e tasmota32-DE

      - uses: actions/upload-artifact@v7
        with:
          name: Tasmota-Nous-A8T
          path: ./.pio/build/tasmota32-DE/firmware.bin
