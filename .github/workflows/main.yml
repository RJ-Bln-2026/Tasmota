# 008b main.yml für Tasmota32-DE V15.5.0.1 für EN-Originalversion
name: Tasmota-Nous-A8T-Build
on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup-Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prepare PlatformIO
        run: |
          pip install platformio
          cp ./platformio_override_sample.ini ./platformio_override.ini
          
          # KORREKTUR 1: Setzt das Environment zwingend auf die Custom-Variante, um config_override.h einzulesen
          sed -i 's/;default_envs = tasmota32/default_envs = tasmota32_custom/g' ./platformio_override.ini
          sed -i 's/default_envs = tasmota32/default_envs = tasmota32_custom/g' ./platformio_override.ini

          # KORREKTUR 2: Schreibt das Config-Override-Flag bombensicher direkt in die platformio_override.ini
          echo "build_flags = -DUSE_CONFIG_OVERRIDE" >> ./platformio_override.ini

      - name: Run Build
        run: |
          # KORREKTUR 3: Führt den Build exakt für das Custom-Target aus
          pio run -e tasmota32_custom

      - uses: actions/upload-artifact@v4
        with:
          name: Tasmota-Nous-A8T
          path: ./.pio/build/tasmota32_custom/firmware.bin
