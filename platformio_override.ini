; -------------------------------------------------------------------
; platformio_override.ini
; Aktiviert user_config_override.h und entfernt große Module,
; damit Telegram, WebSend TLS, HTTPS und Berry zuverlässig kompiliert.
; Diese Datei MUSS im Projekt-Root liegen:
; Tasmota / platformio_override.ini
; -------------------------------------------------------------------

[env:tasmota32]
build_flags =
  -DUSE_CONFIG_OVERRIDE        ; Aktiviert user_config_override.h
  -DUSER_CONFIG_OVERRIDE       ; Erzwingt Override statt my_user_config.h

  ; --- Große Module deaktivieren (sonst wird Telegram rausgeworfen) ---
  -DNO_LVGL                    ; Entfernt LVGL (~400 KB)
  -DNO_HASP                    ; Entfernt HASPmota
  -DNO_DISPLAY                 ; Entfernt Display-Renderer
  -DNO_VIDEO                   ; Entfernt Video RMT
  -DNO_AUDIO                   ; Entfernt MP3/Audio
  -DNO_JPEG                    ; Entfernt JPEGDEC
  -DNO_FINGERPRINT             ; Entfernt Fingerprint
  -DNO_STEPPER                 ; Entfernt Stepper
  -DNO_KNX                     ; Entfernt KNX
  -DNO_LORA                    ; Entfernt LoRa
  -DNO_MODBUS                  ; Entfernt Modbus
  -DNO_IR                      ; Entfernt IRremote
  -DNO_SD                      ; Entfernt SD/SD_MMC

; -------------------------------------------------------------------
; Ergebnis:
; - Override wird aktiv
; - Telegram wird kompiliert
; - WebSend HTTPS funktioniert
; - Tmsend funktioniert
; - BuildInfo funktioniert
; - Berry + UFILESYS funktionieren
; -------------------------------------------------------------------
